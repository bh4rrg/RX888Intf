; RX888Intf.ini - RX888/RX666 SkimSrv driver (RX888Intf.dll) configuration.
; Copy next to RX888Intf.dll (same directory as SkimSrv.exe).

[RX888]
; IQ amplitude scale delivered to SkimSrv. Directly affects decode
; threshold - do not change casually.
; Current fleet values: RX666 = 6000 / RX888 = 10.0
OutputScale=6000

; HF RF attenuation in dB: 0 / 10 / 20 only (3-step GPIO attenuator).
HfAttenuation=0

; Decoder unpause strategy: 0 = gentle (default, recommended), 1 = force.
UnpauseMode=0
